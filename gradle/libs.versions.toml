[versions]
antlr = "4.13.2"
catalog-update = "1.1.1"
pcre4j = "1.0.1"

[plugins]
catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "catalog-update" }

[libraries]
antlr = { module = "org.antlr:antlr4", version.ref = "antlr" }
pcre4j = { module = "org.pcre4j:regex", version.ref = "pcre4j" }
pcre4j-bundle = { module = "org.pcre4j:pcre4j-native-all", version.ref = "pcre4j" }
pcre4j-ffm = { module = "org.pcre4j:ffm", version.ref = "pcre4j" }
pcre4j-jna = { module = "org.pcre4j:jna", version.ref = "pcre4j" }
