name: Build KDoc
on: workflow_dispatch

jobs:
  test:
    name: Build docs
    runs-on: own-forgejo
    container:
      image: eclipse-temurin:21-jdk-alpine
    steps:
      - name: Install deps
        run: |
          apk add --no-cache nodejs tar xz curl
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.CB_TOKEN }}
      - name: Run Dokka
        run: |
          chmod +x ./gradlew
          ./gradlew :dokkaGenerateHtml --no-daemon
      - name: Upload package
        run: |
          FILENAME="stonecutter-kdoc-${{ forgejo.ref_name }}.tar.xz"
          tar -cJvf "$FILENAME" -C build/dokka/html/ .
          curl -H "Authorization: token ${{ secrets.CB_TOKEN }}" -X DELETE \
               "https://codeberg.org/api/packages/${{ forgejo.repository_owner }}/generic/stonecutter-kdoc/${{ forgejo.ref_name }}/"
          curl -H "Authorization: token ${{ secrets.CB_TOKEN }}" \
               --upload-file "$FILENAME" \
               "https://codeberg.org/api/packages/${{ forgejo.repository_owner }}/generic/stonecutter-kdoc/${{ forgejo.ref_name }}/$FILENAME"