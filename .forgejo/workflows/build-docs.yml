name: Build KDoc
on:
  workflow_dispatch:

env:
  MAIN: '0.10'

jobs:
  build-docs:
    name: Build docs
    runs-on: kiku-server
    container: node:24-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.CB_TOKEN }}
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run Dokka
        run: |
          ./gradlew :dokkaGenerateHtml --no-daemon
      - name: Upload package
        run: |
          FILENAME="stonecutter-kdoc-${{ forgejo.ref_name }}.tar.xz"
          tar -cJf "$FILENAME" -C build/dokka/html/ .
          curl -H "Authorization: token ${{ secrets.CB_TOKEN }}" -X DELETE \
               "https://codeberg.org/api/packages/${{ forgejo.repository_owner }}/generic/stonecutter-kdoc/${{ forgejo.ref_name }}/"
          curl -H "Authorization: token ${{ secrets.CB_TOKEN }}" \
               --upload-file "$FILENAME" \
               "https://codeberg.org/api/packages/${{ forgejo.repository_owner }}/generic/stonecutter-kdoc/${{ forgejo.ref_name }}/$FILENAME"
      - name: Trigger merged docs build
        continue-on-error: true
        run: |
          curl -f -X POST \
            -H "Authorization: token ${{ secrets.CB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ env.MAIN }}"}' \
            "${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}/actions/workflows/merge-docs.yml/dispatches"
