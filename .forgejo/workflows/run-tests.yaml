name: Run tests
on: [push]

jobs:
  test:
    name: Test on ${{ matrix.gradle-version }}
    runs-on: own-forgejo
    strategy:
      matrix:
        gradle-version: ["9.0.0", current, rc]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.CB_TOKEN }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          cache: gradle
          java-version: "21"
          distribution: "temurin"
      - name: Run tests
        uses: https://github.com/burrunan/gradle-cache-action@v3
        with:
          arguments: test --configuration-cache --build-cache
          gradle-version: ${{ matrix.gradle-version }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports-gradle-${{ matrix.gradle-version }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
