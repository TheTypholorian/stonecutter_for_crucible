name: Run tests
on: [push]

jobs:
  test:
    runs-on: own-forgejo
    strategy:
      matrix:
        gradle-version: ["9.0.0", "current", "release-candidate"]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup Java
        uses: https://github.com/actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Setup Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ matrix.gradle-version }}
      - name: Run tests
        run: gradle test --configuration-cache --build-cache
      - name: Upload test reports
        if: always()
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: test-reports-gradle-${{ matrix.gradle-version }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
