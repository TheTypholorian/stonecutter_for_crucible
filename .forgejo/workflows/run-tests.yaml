name: Run tests
on: [push]

jobs:
  test:
    name: Test on ${{ matrix.gradle-version }}
    runs-on: own-forgejo
    container:
      image: eclipse-temurin:21-jdk-alpine
    strategy:
      matrix:
        gradle-version: ["9.0.0", current, rc]
      fail-fast: false
    steps:
      - name: Install deps
        run: |
          apk add --no-cache nodejs zstd tar
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.CB_TOKEN }}
      - name: Run tests
        uses: https://github.com/burrunan/gradle-cache-action@v3
        with:
          concurrent: true
          job-id: test-${{ matrix.gradle-version }}
          arguments: test --configuration-cache
          gradle-version: ${{ matrix.gradle-version }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports-gradle-${{ matrix.gradle-version }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
