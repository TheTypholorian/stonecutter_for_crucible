name: Run tests
on:
  push:
    paths:
      - stitcher/src/**
      - stonecutter/src/**
      - .forgejo/workflows/run-tests.yaml

jobs:
  test:
    name: Run tests
    runs-on: own-forgejo
    container:
      image: eclipse-temurin:21-jdk-alpine
    steps:
      - name: Install deps
        run: |
          apk add --no-cache nodejs tar
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.CB_TOKEN }}
      - name: Setup Gradle
        run: |
          chmod +x ./gradlew
      - name: Run tests
        run: |
          ./gradlew check --build-cache --configuration-cache
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports-gradle-${{ matrix.gradle-version }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
