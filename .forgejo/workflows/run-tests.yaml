name: Run tests
on: [push]

jobs:
  test:
    name: Test on ${{ matrix.gradle-version }}
    runs-on: own-forgejo
    container:
      image: eclipse-temurin:21-jdk-alpine
    strategy:
      matrix:
        gradle-version: ["9.0.0", current, release-candidate]
      fail-fast: false
    steps:
      - name: Install deps
        run: |
          apk add --no-cache nodejs tar
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.CB_TOKEN }}
      - name: Setup Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ matrix.gradle-version }}
      - name: Run tests
        run: |
          gradle test validatePlugins --build-cache --configuration-cache
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports-gradle-${{ matrix.gradle-version }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
