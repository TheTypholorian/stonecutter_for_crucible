name: Merge KDoc
on:
  workflow_dispatch:

env:
  MAIN: '0.10'

jobs:
  merge-docs:
    name: Build merged docs
    runs-on: kiku-server
    container: node:24-bookworm
    if: ${{ forgejo.ref_name == env.MAIN }}
    steps:
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends jq
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.CB_TOKEN }}
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Fetch versions
        run: |
          curl -s "https://codeberg.org/api/v1/packages/${{ forgejo.repository_owner }}?q=stonecutter-kdoc" \
          | jq -r '.[] | select(.version != "${{ forgejo.ref_name }}" and .version != "merged") | .version' > versions.txt
      - name: Download doc packages
        run: |
          mkdir -p kdoc-versions
          while read version; do
            [ -z "$version" ] && continue
            FILE="stonecutter-kdoc-${version}.tar.xz"
            URL="https://codeberg.org/api/packages/${{ forgejo.repository_owner }}/generic/stonecutter-kdoc/${version}/${FILE}"

            mkdir -p "kdoc-versions/${version}"
            curl -L -o "${FILE}" "${URL}"
            tar -xJf "${FILE}" -C "kdoc-versions/${version}"
          done < versions.txt
      - name: Run Dokka
        run: |
          ./gradlew :dokkaGenerateHtml --no-daemon
      - name: Upload package
        run: |
          FILENAME="stonecutter-kdoc-merged.tar.xz"
          tar -cJf "$FILENAME" -C build/dokka/html/ .
          curl -H "Authorization: token ${{ secrets.CB_TOKEN }}" -X DELETE \
               "https://codeberg.org/api/packages/${{ forgejo.repository_owner }}/generic/stonecutter-kdoc/merged/"
          curl -H "Authorization: token ${{ secrets.CB_TOKEN }}" \
               --upload-file "$FILENAME" \
               "https://codeberg.org/api/packages/${{ forgejo.repository_owner }}/generic/stonecutter-kdoc/merged/$FILENAME"
      - name: Trigger pages update
        continue-on-error: true
        run: |
          curl -f -X POST \
            -H "Authorization: token ${{ secrets.CB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "https://codeberg.org/api/v1/repos/${{ forgejo.repository_owner }}/docs/actions/workflows/update-pages.yml/dispatches"
