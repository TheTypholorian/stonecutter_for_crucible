def target = "1"
def parsed = stonecutter.current.parsed
// `"$target"` is a GString rather than a String, so this only works if the operand is coerced.
// Ranges are Kotlin-only, so Groovy reaches the vararg forms as plain methods instead.
print("[${stonecutter.current.version}: ${parsed.compareTo("$target")} ${parsed.matches('>=1')} ${parsed.matches('>=1', '<3')} ${parsed.invoke('>=1')}]")
